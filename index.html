<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step Study Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <div class="flashcard">
      <div class="card">
        <div class="card-container">
          <div class="card-front">
            <h1 id="term">Click Me!</h1>
          </div>
          <div class="card-back">
            <p id="definition"></p>
          </div>
        </div>
      </div>

      <div id="options">
        <button id="got-it">✓</button>
        <button id="missed-it">✗</button>
      </div>
      <div id="levels">
        <div class="level" id="level-1">
          <h1>0</h1>
        </div>
        <div class="level" id="level-2">
          <h1>0</h1>
        </div>
        <div class="level" id="level-3">
          <h1>0</h1>
        </div>
        <div class="level" id="level-4">
          <h1>0</h1>
        </div>
        <div class="level" id="level-5">
          <h1>0</h1>
        </div>
      </div>
    </div>

    <a href="pages/editor.html" id="access-editor">✏️</a>
  </div>

  <script src="script.js"></script>
</body>

</html>
