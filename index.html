<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step Study Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <div class="">
      <div class="card">
        <div class="card-container">
          <div class="card-front">
            <h1 id="term"></h1>
            <p class="card-num"></p>
          </div>
          <div class="card-back">
            <p id="definition"></p>
            <p class="card-num"></p>
          </div>
        </div>

        <div class="cleared hidden">
          <h1>Nice! This Level is cleared!</h1>
          <p>Click on the levels on the bottom of the page</p>
        </div>
      </div>

      <div id="options">
        <button id="got-it" class="choice-btn">✓</button>
        <button id="missed-it" class="choice-btn">✗</button>
      </div>

      <div id="levels">
        <div class="relative">
          <div class="level" id="level-1">
            <h1 class="level-label">0</h1>
          </div>
          <h1 class="marker hidden" id="mark-1">➤</h1>
        </div>

        <div class="relative">
          <div class="level" id="level-2">
            <h1 class="level-label">0</h1>
          </div>
          <h1 class="marker hidden" id="mark-2">➤</h1>
        </div>

        <div class="relative">
          <div class="level" id="level-3">
            <h1 class="level-label">0</h1>
          </div>
          <h1 class="marker hidden" id="mark-3">➤</h1>
        </div>

        <div class="relative">
          <div class="level" id="level-4">
            <h1 class="level-label">0</h1>
          </div>
          <h1 class="marker hidden" id="mark-4">➤</h1>
        </div>

        <div class="relative">
          <div class="level" id="level-5">
            <h1 class="level-label">0</h1>
          </div>
          <h1 class="marker hidden" id="mark-5">➤</h1>
        </div>

          <div class="editor hidden">
            
            <div class="add-new editor-item">
              <button id="addnew-btn">+</button>
            </div>
          </div>
      </div>
    </div>

    <a id="access-editor" class="config-btn" href="#"><img src="imgs/pencil-emoji.png" alt="Edit!" /></a>
    <a id="study-btn" class="config-btn hidden" href="#"><img src="../imgs/study-emoji.png" alt="Study!" /></a>
    <a id="reset-all" class="config-btn"><img src="imgs/restart-emoji.png" alt="Edit!" /></a>
  </div>

  <script src="script.js"></script>
</body>

</html>
